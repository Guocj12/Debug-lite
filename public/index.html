<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Debug-Lite 霓虹像素格斗</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="menu" class="screen active">
    <h1 class="n1">DEBUG-LITE</h1>
    <p class="n2">霓虹像素格斗 v2.2</p>
    <div class="menu-btns">
      <button class="btn btn-b" onclick="enterCharSelect('ai')">⚔️ 人机对战</button>
      <button class="btn btn-g" onclick="enterCharSelect('train')">🎯 训练场</button>
      <button class="btn btn-p" onclick="enterCharSelect('online')">🌐 联机对战</button>
      <button class="btn btn-y" onclick="nav('editor')">📝 技能编辑</button>
    </div>
    <div class="ver">16格横版 · 弹幕碰撞 · 像素动画</div>
  </div>

  <div id="charSel" class="screen">
    <h2 class="n1 sm">选择角色</h2>
    <div id="cg" class="cg"></div>
    <div id="skillSel" class="sk hidden">
      <h3>选择技能 (3个)</h3>
      <div id="sg" class="sg"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-b" id="startBtn">开始对战</button>
      <button class="btn btn-d" onclick="nav('menu')">返回</button>
    </div>
  </div>

  <div id="lobby" class="screen">
    <h2 class="n1 sm">联机对战</h2>
    <div class="lbi"><input id="pname" class="inp" placeholder="昵称" maxlength="10"><button class="btn btn-b" onclick="createRoom()">创建</button></div>
    <div class="lbi"><input id="rcode" class="inp" placeholder="房间号" maxlength="6" style="text-transform:uppercase"><button class="btn btn-p" onclick="joinRoom()">加入</button></div>
    <div id="ostatus" class="sts"></div>
    <button class="btn btn-d" onclick="nav('menu')">返回</button>
  </div>

  <!-- 战斗场景 -->
  <div id="battle" class="screen">
    <div class="bh">
      <div class="pi" id="p1i"><div class="pn">P1</div>
        <div class="bar-c"><div class="bar bar-hp" id="p1hp"></div><span class="bar-txt" id="p1hpt">0/0</span></div>
        <div class="bar-c"><div class="bar bar-mp" id="p1mp"></div><span class="bar-txt" id="p1mpt">0/0</span></div>
        <div class="bar-c"><div class="bar bar-sp" id="p1sp"></div><span class="bar-txt" id="p1spt">0/0</span></div>
      </div>
      <div class="tmr" id="tmrArea">
        <div class="rnd" id="rnd">ROUND 1</div>
        <div class="t" id="tm">60</div>
      </div>
      <div class="pi mir" id="p2i"><div class="pn">P2</div>
        <div class="bar-c"><div class="bar bar-hp" id="p2hp"></div><span class="bar-txt" id="p2hpt">0/0</span></div>
        <div class="bar-c"><div class="bar bar-mp" id="p2mp"></div><span class="bar-txt" id="p2mpt">0/0</span></div>
        <div class="bar-c"><div class="bar bar-sp" id="p2sp"></div><span class="bar-txt" id="p2spt">0/0</span></div>
      </div>
    </div>
    <div class="fld"><canvas id="fc"></canvas></div>
    <!-- 编辑阶段面板（仅在prepare时显示） -->
    <div class="aq" id="actionQueuePanel">
      <h3>行动队列 <span id="acnt">(0/16)</span></h3>
      <div id="aslots" class="aslots"></div>
      <div class="abtns" id="abtns"></div>
      <div class="qc">
        <button class="btn btn-b s" onclick="clearActions()">清空</button>
        <button class="btn btn-p s" onclick="undoAction()">撤销</button>
        <button class="btn btn-g s" onclick="randomFill()">随机</button>
        <button class="btn btn-y s" id="rdyBtn" onclick="readyBattle()">✅ 完成</button>
        <button class="btn btn-d s" onclick="quitBattle()">🚪 退出</button>
      </div>
    </div>
    <div class="log"><div id="logc"></div></div>
  </div>

  <div id="result" class="screen">
    <div class="res"><h2 class="n1" id="rtitle"></h2><p id="rdetail"></p>
      <button class="btn btn-b" onclick="nav('charSel');initCharSel('ai')">再来</button>
      <button class="btn btn-d" onclick="nav('menu')">菜单</button>
    </div>
  </div>

  <div id="editor" class="screen">
    <h2 class="n1 sm">技能编辑器</h2>
    <div class="edp"><p>🔧 技能编辑器开发中...</p><p class="h">即将支持自定义像素动画配置</p></div>
    <button class="btn btn-d" onclick="nav('menu')">返回</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="js/game.js"></script>
</body>
</html>
