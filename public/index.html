<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>霓虹像素对战</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>
    <!-- 扫描线覆盖层 -->
    <div class="scanlines-overlay"></div>

    <!-- 主容器 -->
    <div id="app-container">

        <!-- ====== 大厅面板 ====== -->
        <div id="panel-lobby" class="panel active">
            <div class="neon-title">
                <h1>⚔️ 霓 虹 像 素 对 战 ⚔️</h1>
                <p class="subtitle">NEON PIXEL BATTLE</p>
            </div>
            <div class="lobby-form">
                <div class="input-group">
                    <label>🎭 你的昵称</label>
                    <input type="text" id="input-nickname" placeholder="输入昵称..." maxlength="12" autocomplete="off">
                </div>
                <div class="lobby-buttons">
                    <button id="btn-create-room" class="neon-btn neon-cyan">🏠 创建房间</button>
                    <div class="join-section">
                        <input type="text" id="input-room-id" placeholder="房间号" maxlength="4" autocomplete="off" class="room-input">
                        <button id="btn-join-room" class="neon-btn neon-pink">🚪 加入房间</button>
                    </div>
                </div>
            </div>
            <div id="lobby-status" class="status-text"></div>
        </div>

        <!-- ====== 技能选择面板 ====== -->
        <div id="panel-skill-select" class="panel">
            <h2>🔮 选择你的技能</h2>
            <p class="hint">最多选择 <span id="max-skill-slots">3</span> 个技能</p>
            <div id="skill-list" class="skill-list"></div>
            <div class="skill-select-footer">
                <span id="skill-select-count" class="status-text">已选 0/3</span>
                <button id="btn-confirm-skills" class="neon-btn neon-cyan" disabled>✅ 确认技能</button>
            </div>
        </div>

        <!-- ====== 准备阶段面板 ====== -->
        <div id="panel-prepare" class="panel">
            <div class="prepare-header">
                <div class="timer-section">
                    <span class="timer-label">⏱ 剩余时间</span>
                    <span id="prepare-timer" class="timer-value">60</span>
                </div>
                <div class="opponent-status">
                    <span id="opponent-queue-status">对手: 队列 0 | 未确认</span>
                </div>
            </div>

            <div class="prepare-main">
                <!-- 你的行动队列 -->
                <div class="queue-section">
                    <h3>📋 你的行动队列 <span id="queue-confirmed-badge" class="badge hidden">已锁定 ✓</span></h3>
                    <div id="action-queue-display" class="action-queue-display">
                        <p class="empty-hint">从下方按钮添加行动</p>
                    </div>
                    <div class="queue-controls">
                        <button id="btn-delete-action" class="neon-btn-sm neon-red" disabled>🗑 删除选中</button>
                        <button id="btn-clear-queue" class="neon-btn-sm neon-yellow">🧹 清空全部</button>
                        <button id="btn-confirm-queue" class="neon-btn neon-cyan">🔒 确认锁定</button>
                    </div>
                </div>

                <!-- 行动按钮面板 -->
                <div class="action-buttons-panel">
                    <h3>🎮 行动面板</h3>
                    <div class="action-group">
                        <h4>🚶 移动</h4>
                        <div class="move-buttons">
                            <button class="action-btn move-btn" data-action="move" data-direction="up">⬆ 上移</button>
                            <button class="action-btn move-btn" data-action="move" data-direction="left">⬅ 左移</button>
                            <button class="action-btn move-btn" data-action="move" data-direction="down">⬇ 下移</button>
                            <button class="action-btn move-btn" data-action="move" data-direction="right">➡ 右移</button>
                        </div>
                    </div>
                    <div class="action-group">
                        <h4>⚔️ 战斗</h4>
                        <div class="battle-buttons">
                            <button class="action-btn attack-btn" data-action="attack">⚔ 攻击</button>
                            <button class="action-btn defend-btn" data-action="defend">🛡 防御</button>
                        </div>
                    </div>
                    <div class="action-group">
                        <h4>✨ 技能</h4>
                        <div id="skill-buttons" class="skill-buttons"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ====== 战斗阶段面板 ====== -->
        <div id="panel-battle" class="panel">
            <div class="battle-hud">
                <div class="player-info" id="player1-info">
                    <span class="player-name" id="p1-name">你</span>
                    <div class="hp-bar-container">
                        <div class="hp-bar-fill neon-hp" id="p1-hp-fill"></div>
                        <span class="hp-text" id="p1-hp-text">100/100</span>
                    </div>
                </div>
                <div class="round-display">
                    <span id="round-text">回合 1</span>
                </div>
                <div class="player-info" id="player2-info">
                    <span class="player-name" id="p2-name">对手</span>
                    <div class="hp-bar-container">
                        <div class="hp-bar-fill neon-hp-opponent" id="p2-hp-fill"></div>
                        <span class="hp-text" id="p2-hp-text">100/100</span>
                    </div>
                </div>
            </div>

            <div class="battle-canvas-container">
                <canvas id="battle-canvas"></canvas>
            </div>

            <div id="action-feed" class="action-feed">
                <p class="feed-placeholder">战斗开始...</p>
            </div>
        </div>

        <!-- ====== 游戏结束面板 ====== -->
        <div id="panel-game-over" class="panel">
            <div id="game-over-content">
                <h1 id="game-over-title">⚔️ 战斗结束 ⚔️</h1>
                <p id="game-over-result"></p>
                <div id="game-over-stats" class="stats-grid"></div>
                <div class="game-over-buttons">
                    <button id="btn-rematch" class="neon-btn neon-cyan">🔄 再来一局</button>
                    <button id="btn-back-to-lobby" class="neon-btn neon-pink">🚪 返回大厅</button>
                </div>
            </div>
        </div>

        <!-- ====== 消息/错误提示 ====== -->
        <div id="toast" class="toast hidden"></div>

        <!-- ====== 断线遮罩 ====== -->
        <div id="disconnect-overlay" class="disconnect-overlay hidden">
            <div class="disconnect-content">
                <h2>🔌 连接断开</h2>
                <p id="disconnect-msg">正在重连...</p>
            </div>
        </div>
    </div>

    <!-- JS 脚本 -->
    <script src="js/utils/PixelDrawer.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/game/ActionQueue.js"></script>
    <script src="js/ui/PixelRenderer.js"></script>
    <script src="js/ui/LobbyUI.js"></script>
    <script src="js/ui/SkillSelectUI.js"></script>
    <script src="js/ui/PrepareUI.js"></script>
    <script src="js/game/BattleAnimator.js"></script>
    <script src="js/ui/BattleUI.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
